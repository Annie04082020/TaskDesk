<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>專注進行中 · TaskDesk Focus Guardian</title>
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <div class="guardian-container">
    <div class="guardian-card">
      <div class="guardian-header">
        <div class="guardian-badge">
          <span class="badge-dot"></span>
          <span>TASKDESK FOCUS GUARDIAN</span>
        </div>
        <h1 class="guardian-title">目前正在專注工作中</h1>
        <p class="guardian-subtitle">守護你的深度心流，攔截潛在分心干擾。</p>
      </div>

      <div class="task-spotlight">
        <div class="spotlight-label">當前主要任務</div>
        <div class="spotlight-title" id="activeTaskTitle">專注任務執行中</div>
        <div class="spotlight-meta">
          <span class="meta-item" id="targetSiteText">攔截目標：YouTube</span>
        </div>
      </div>

      <div class="guardian-actions">
        <button id="btnReturnDesk" class="btn btn-primary">
          <span>返回 TaskDesk 工作桌</span>
        </button>

        <div class="pass-panel">
          <div class="pass-panel-title">臨時通行這個網站</div>
          <div class="pass-options" role="group" aria-label="通行時間">
            <label><input type="radio" name="passMinutes" value="3" checked>3 分鐘</label>
            <label><input type="radio" name="passMinutes" value="5">5 分鐘</label>
            <label><input type="radio" name="passMinutes" value="10">10 分鐘</label>
            <label><input type="radio" name="passMinutes" value="25">25 分鐘</label>
          </div>
          <label class="custom-pass-row">
            <span>自訂</span>
            <input type="number" id="customPassMinutes" min="1" max="120" placeholder="分鐘">
          </label>
          <button id="btnFrictionPass" class="btn btn-secondary">
            <span id="frictionPassText">深呼吸 5 秒後通行 3 分鐘</span>
          </button>
        </div>

        <button id="btnCloseTab" class="btn btn-ghost">
          <span>關閉此分頁</span>
        </button>
      </div>

      <!-- 深呼吸冷卻狀態覆蓋層 -->
      <div id="frictionCountdown" class="friction-overlay" style="display: none;">
        <div class="breathing-circle">
          <span id="countdownNumber">5</span>
        </div>
        <div class="friction-note">深呼吸，確認是否為必要操作...</div>
      </div>
    </div>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
