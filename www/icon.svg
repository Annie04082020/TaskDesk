<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2229"/>
      <stop offset="100%" stop-color="#0f1115"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a303c"/>
      <stop offset="100%" stop-color="#1f242e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>

  <!-- Desk / Card representation -->
  <g transform="translate(96, 100)">
    <!-- Main Focus Card (Now) -->
    <rect x="0" y="0" width="320" height="150" rx="20" fill="url(#card)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2.5"/>
    <rect x="24" y="28" width="14" height="14" rx="4" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <rect x="54" y="32" width="180" height="8" rx="4" fill="#f1f5f9"/>
    <rect x="54" y="52" width="120" height="6" rx="3" fill="#94a3b8" fill-opacity="0.8"/>
    
    <!-- Active Indicator dot & chip -->
    <rect x="24" y="94" width="68" height="24" rx="12" fill="#38bdf8" fill-opacity="0.15"/>
    <text x="58" y="111" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">現在</text>

    <!-- Sub tasks lines -->
    <rect x="210" y="103" width="86" height="6" rx="3" fill="#475569"/>

    <!-- Second Card (Week) -->
    <rect x="0" y="170" width="320" height="68" rx="16" fill="url(#card)" stroke="#334155" stroke-width="1.5"/>
    <rect x="24" y="196" width="14" height="14" rx="4" fill="none" stroke="#64748b" stroke-width="2.5"/>
    <rect x="54" y="199" width="160" height="8" rx="4" fill="#cbd5e1"/>

    <!-- Third Card (Week) -->
    <rect x="0" y="254" width="320" height="68" rx="16" fill="url(#card)" stroke="#334155" stroke-width="1.5"/>
    <rect x="24" y="280" width="14" height="14" rx="4" fill="none" stroke="#64748b" stroke-width="2.5"/>
    <rect x="54" y="283" width="130" height="8" rx="4" fill="#cbd5e1"/>
  </g>
</svg>
